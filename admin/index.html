<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#131F37">
<title>Chowder Pedidos</title>
<link rel="icon" href="../assets/img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: funil em 3 etapas (contato → orçamento → evento) + arquivo; cartões em grade, detalhe em gaveta lateral */
:root{
  --bg:#F5EFE6; --surface:#FCF9F4; --surface-2:#F3ECE1; --ink:#131F37; --muted:#5E6275; --line:#E4D9C8;
  --navy:#131F37; --bord:#591524; --gold:#C4A265;
  --accent:#131F37; --accent-ink:#FFFFFF; --accent-soft:#E2E5EE; --wine:#591524; --wine-soft:#F3E3E5; --goldc:#7A5C26; --gold-soft:#F4EAD6;
  --ok:#1F7A4D; --ok-soft:#DFF0E6; --warn:#8E5A00; --warn-soft:#FBEFD9; --crit:#A3262F; --crit-soft:#F8E1E2;
  --shadow:0 1px 2px rgba(19,31,55,.06),0 8px 24px rgba(19,31,55,.08);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1628; --surface:#16213A; --surface-2:#111B30; --ink:#F2ECE3; --muted:#B4B8C8; --line:#2A3656;
  --accent:#D9BC85; --accent-ink:#131F37; --accent-soft:#2A3350; --wine:#E8A3AE; --wine-soft:#3A1E26; --goldc:#D9BC85; --gold-soft:#3A3020;
  --ok:#5CC48E; --ok-soft:#173527; --warn:#EBB056; --warn-soft:#3A2C14; --crit:#F08A8F; --crit-soft:#3D1F22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1628; --surface:#16213A; --surface-2:#111B30; --ink:#F2ECE3; --muted:#B4B8C8; --line:#2A3656;
  --accent:#D9BC85; --accent-ink:#131F37; --accent-soft:#2A3350; --wine:#E8A3AE; --wine-soft:#3A1E26; --goldc:#D9BC85; --gold-soft:#3A3020;
  --ok:#5CC48E; --ok-soft:#173527; --warn:#EBB056; --warn-soft:#3A2C14; --crit:#F08A8F; --crit-soft:#3D1F22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.band{background:radial-gradient(90% 160% at 100% 100%,var(--bord) 0,color-mix(in srgb,var(--bord) 50%,transparent) 40%,transparent 75%),var(--navy);color:#F5EFE6;border-bottom:1px solid rgba(196,162,101,.45);padding-top:env(safe-area-inset-top,0px)}
.band .in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:38px;width:auto;display:block}
.brand h1{font-size:26px;line-height:1.05;padding-left:14px;border-left:1px solid var(--gold);font-weight:500}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:#CDD0DC;letter-spacing:.04em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.band .btn{background:rgba(255,255,255,.08);border-color:rgba(245,239,230,.35);color:#F5EFE6}
.band .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.band .who{font-size:12px;color:#CDD0DC}

.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
@media (max-width:560px){.search{width:100%}.band .who{display:none}.brand h1{font-size:20px}.brand small{display:none}.brand img{height:30px}.top-actions{gap:6px}.top-actions .btn{padding:6px 12px;font-size:13px}}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.sum::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.sum.hot::before{background:var(--bord)}
.sum:hover{border-color:var(--gold)}
.sum .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.sum .val{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1}
.sum .sub{font-size:13px;color:var(--muted)}

.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.tab .n{background:var(--line);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bord)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
.flow .arrow{color:var(--gold);font-size:13px}
.flow .spacer{flex:1}
.search{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-width:0;width:240px;max-width:100%;margin:4px 0}

/* Quadro (Kanban) */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.views{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.views button[aria-pressed="true"]{background:var(--navy);color:#fff}
.views .n{background:var(--bord);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi.hot::before{background:var(--bord)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15}
.kpi.hot .v{color:var(--wine)}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:22px}}
.hoje{display:flex;flex-direction:column;gap:18px}
.hoje h3{font-size:20px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.hoje h3 .c{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.fu-steps{display:grid;gap:8px}
.fu-step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.fu-step.due{border-color:var(--crit);background:var(--crit-soft)}
.fu-step.dim{opacity:.6}
.fu-step .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.fu-step .top b{font-size:14px}
.fu-msg{white-space:pre-wrap;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0}
.fu-note{font-size:14px;margin:0}
.fu-alert{background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dup{color:var(--warn);font-size:13px;margin:0}
.toolbar .search{flex:1 1 260px;width:auto;margin:0}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.col-head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 3px 0 var(--gold)}
.col[data-k="contato"] .col-head{box-shadow:inset 0 3px 0 var(--bord)}
.col[data-k="evento"] .col-head{box-shadow:inset 0 3px 0 var(--navy)}
.col-head .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.col-head .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.col-head .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.col-head .val{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.col-head .sub{font-size:13px;color:var(--muted)}
.col-body{display:flex;flex-direction:column;gap:10px;padding:10px;min-height:140px}
.col-body .card{width:100%}
.col.drop{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.col.drop .col-body{background:var(--gold-soft)}
.col-empty{border:1px dashed var(--line);border-radius:10px;padding:16px 12px;color:var(--muted);font-size:13px;text-align:center}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45}
@media (max-width:820px){.board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(280px,86%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.col{scroll-snap-align:start}}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.card:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.card.novo{border-color:var(--bord);box-shadow:inset 3px 0 0 var(--bord)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.card .name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .meta{color:var(--muted);font-size:13px}
.card .row>.meta.num{white-space:nowrap;flex:none}
.card .snip{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .money{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.wine{background:var(--wine-soft);border-color:transparent;color:var(--wine)}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--goldc)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:22px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}

/* Login */
.login{max-width:400px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.login h2{font-size:28px}
.login p{margin:0;color:var(--muted)}

/* Gaveta */
.scrim{position:fixed;inset:0;background:rgba(14,22,40,.45);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--bg);z-index:11;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.2)}
.dhead{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;box-shadow:inset 0 3px 0 var(--bord)}
.dhead h2{font-size:26px}
.dhead .stage{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--goldc)}
.dbody{flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.dfoot{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dfoot .grow{flex:1}
.dh-acts{display:flex;gap:8px;align-items:center;flex:none}
.mover{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mover select{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.close{border:none;background:var(--surface-2);border-radius:999px;width:34px;height:34px;font-size:18px;flex:none}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
section.box.site{border-color:var(--gold);background:linear-gradient(var(--gold-soft),var(--surface) 70%)}
section.box h3{font-size:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section.box h3 .hint{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.kv .full{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid,.kv{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.cell{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:14px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.tblwrap{overflow-x:auto}
table.items{width:100%;border-collapse:collapse;min-width:460px}
table.items th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 6px;font-weight:700}
table.items td{padding:3px 4px;vertical-align:middle}
table.items td.r,table.items th.r{text-align:right}
.x{border:none;background:none;color:var(--muted);font-size:18px;padding:2px 6px}
.x:hover{color:var(--crit)}
.totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:14px}
.totals .big{font-family:var(--f-display);font-size:26px;font-weight:600}
.timeline{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;font-size:14px;align-items:start;padding-bottom:8px;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:none}
.timeline .d{color:var(--muted);font-size:13px}
.timeline .sys{color:var(--muted);font-style:italic}
.timeline .t{white-space:pre-wrap;overflow-wrap:anywhere}
.addline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.addline .f{flex:1 1 200px}
.addline .f.date{flex:0 0 150px}
.confirm{background:var(--surface);border:1px solid var(--bord);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
.pay{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.pay b{font-family:var(--f-display);font-weight:600;font-size:22px;display:block}
.soc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.soc-row:last-child{border-bottom:0}
.soc-row .who2{flex:1 1 220px;min-width:0}
.soc-row .who2 b{display:block;overflow-wrap:anywhere}
.soc-row .acts{display:flex;gap:6px;flex-wrap:wrap}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;width:100%;padding-top:6px}
.inline .f{flex:1 1 200px}
.msg-err{color:var(--crit);font-size:13px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#F5EFE6;padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 0 0 1px var(--gold)}
/* Promoções */
.pr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}
.pr-head h2{font-size:26px}
.pr-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.pr-wrap{grid-template-columns:minmax(0,1fr)}}
.pr-list{display:flex;flex-direction:column;gap:10px}
.pr-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font:inherit;cursor:pointer}
.pr-card.on{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--bord)}
.pr-card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pr-card .name{font-family:var(--f-display);font-size:20px;font-weight:600}
.pr-n{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1;text-align:right}
.pr-n small{display:block;font:600 11px var(--f-body);color:var(--muted)}
.pr-link{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr-link input{flex:1 1 220px}
.pr-slug{display:flex;align-items:center;gap:2px;font-weight:400;color:var(--muted);font-size:13px;flex-wrap:wrap}
.pr-slug input{flex:1 1 140px}
.pl{display:flex;flex-direction:column}
.pl-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl-row.dim{opacity:.62}
.pl-row .who2{display:flex;flex-direction:column;min-width:0}
.pl-row .who2 b{overflow-wrap:anywhere}
.pl-row .ct{display:flex;flex-direction:column;font-size:14px;min-width:0}
.pl-row .ct a{color:var(--ink);overflow-wrap:anywhere}
.pl-row .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.pl-row{grid-template-columns:minmax(0,1fr)}}
.pr-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pr-imgs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.pr-imgs img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface-2);display:block}
.pr-imgs .capa{position:absolute;top:6px;left:6px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;box-shadow:0 0 0 1px var(--gold)}
.pr-imgs .ia{display:flex;gap:4px;justify-content:center;padding:6px;border-top:1px solid var(--line)}
.pr-imgs .ia .btn{padding:4px 9px}
.pr-add{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:1.5px dashed var(--gold);border-radius:10px;cursor:pointer;font-weight:700;color:var(--ink);text-align:center;padding:10px}
.pr-add small{font-weight:400;color:var(--muted)}
.pr-add input{position:absolute;width:1px;height:1px;opacity:0}
.pr-add.busy{cursor:wait;opacity:.7}
.pr-add:focus-within{outline:3px solid var(--gold);outline-offset:2px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--bord)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<body>
<div class="band"><div class="in">
  <div class="brand"><img src="../assets/img/logo-h-clara.webp" alt="Chowder Macarons" width="134" height="38"><h1>Pedidos e eventos<small>Contatos, orçamentos e eventos contratados</small></h1></div>
  <div class="top-actions" id="topActions" hidden>
    <span class="who" id="who"></span>
    <button class="btn" id="btnMsgs">Mensagens</button>
    <button class="btn" id="btnSocios">Sócios</button>
    <button class="btn" id="btnExport">Exportar planilha (CSV)</button>
    <button class="btn" id="btnSair">Sair</button>
    <button class="btn primary" id="btnNovo">+ Novo contato</button>
  </div>
</div></div>

<form class="login" id="login" hidden>
  <h2>Entrar no painel</h2>
  <p>Acesso restrito aos sócios da Chowder Macarons.</p>
  <label class="f">E-mail<input id="lg_email" type="email" autocomplete="username" required></label>
  <label class="f">Senha<input id="lg_senha" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit" style="justify-content:center;padding:10px">Entrar</button>
  <p id="lg_msg" style="color:var(--crit)" hidden></p>
</form>

<div class="wrap" id="app">
  <div id="notice" class="notice" hidden></div>
  <div id="main" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="toolbar" id="toolbar"></div>
    <div id="board" style="margin-top:14px"></div>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="socRoot"></div>
<div id="msgRoot"></div>
<div id="promoRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="../js/config.js"></script>
<script src="../assets/vendor/supabase.min.js"></script>
<script>
(function(){
const C=window.CHOWDER;
const STAGES=[
  {k:'contato',label:'Contatos'},
  {k:'orcamento',label:'Orçamentos'},
  {k:'evento',label:'Eventos contratados'},
  {k:'arquivo',label:'Arquivo'}
];
const STAGE_TITLE={contato:'Contato (lead)',orcamento:'Orçamento',evento:'Evento contratado',arquivo:'Arquivado'};
const ORIGENS=['Site','Instagram','Meta Ads (Instagram/Facebook)','Google Ads','Instagram orgânico','WhatsApp','Indicação','Fábrica','Outro'];
const REUNIAO_TIPOS=['Degustação na fábrica','Presencial na fábrica','Videochamada','Ligação','No local do evento'];
const TIPOS=['Evento','Pronta entrega'];
const CATEGORIAS=[...new Set([...C.ocasioes.filter(o=>o!=='Outro'),'Presente','Pronta entrega','Outro'])];
const FORMAS=['PIX','Cartão de crédito','Cartão de débito','Dinheiro','Transferência','Boleto'];
const MODOS=['Entrega no local','Retirada na fábrica'];
const MOT_ENCERRAR=['Só pesquisando preço','Parou de responder','Data indisponível','Fora do orçamento do cliente','Fechou com outro fornecedor','Outro'];
const MOT_RECUSA=['Achou caro','Fechou com outro fornecedor','Desistiu do evento','Sem resposta no prazo','Mudou a data','Outro'];
const RESULT={contato_encerrado:{t:'Contato encerrado',c:'warn'},orcamento_recusado:{t:'Orçamento não aceito',c:'crit'},sem_resposta:{t:'Desistência (sem resposta)',c:'warn'},entregue:{t:'Entregue com sucesso',c:'ok'}};

let sb=null, canWrite=true, userEmail='';
let recs={}; let loaded=false;
let tab='hoje'; let q='';
const DIA=864e5;
const FU=[{k:'h24',ms:DIA,label:'24 horas'},{k:'d3',ms:3*DIA,label:'3 dias'},{k:'d7',ms:7*DIA,label:'7 dias'},{k:'d30',ms:30*DIA,label:'30 dias'},{k:'d60',ms:60*DIA,label:'60 dias'},{k:'d90',ms:90*DIA,label:'90 dias · última'}];
const ULTIMO=FU[FU.length-1];
const MSG_PADRAO={
 h24:'Oi, {nome}! Tudo bem? Aqui é da Chowder Macarons.\nPassando para saber se você conseguiu ver o orçamento para o seu {evento}. Ficou alguma dúvida sobre sabores, cores ou embalagens? Posso te ajudar a ajustar o que for preciso.',
 d3:'Oi, {nome}! Como nossa produção é toda artesanal, trabalhamos com agenda limitada e as datas vão sendo reservadas.\nSe quiser, consigo segurar {data} por mais alguns dias, ou adaptar o orçamento (quantidade, sabores ou embalagem) para ficar do jeitinho que você imaginou. O que acha?',
 d7:'Oi, {nome}! Passando de novo por aqui para saber como estão os preparativos do seu {evento}.\nSe quiser, monto uma nova proposta com outra quantidade, sabores ou embalagem, sem compromisso. É só me dizer o que ficou melhor para você.',
 d30:'Oi, {nome}! Faz um tempinho que conversamos sobre o seu {evento}.\nAinda estamos com algumas datas livres na agenda. Se os planos continuam de pé, consigo retomar o orçamento rapidinho. Posso te ajudar?',
 d60:'Oi, {nome}! Tudo bem? Aqui é da Chowder Macarons.\nTemos sabores e opções de embalagem novos, que podem combinar com o seu {evento} ou com uma próxima comemoração. Quer que eu te mande algumas ideias?',
 d90:'Oi, {nome}! Essa é minha última mensagem para não te incomodar.\nSe ainda fizer sentido ter os macarons da Chowder no seu {evento} ou em outra ocasião, é só responder aqui que retomamos de onde paramos. Obrigado pelo contato e conte com a gente quando precisar!'};
let mensagens={...MSG_PADRAO};
let open=null; // {id,isNew,draft,dirty,pending}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s)||new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>{const d=parse(s);if(!d)return null;const t=parse(today());return Math.round((d-t)/864e5)};
const fd=s=>{const d=parse(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'};
const fds=s=>{const d=parse(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):'—'};
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{if(typeof v==='number')return v;const s=String(v??'').trim().replace(/\s/g,'').replace(/R\$/,'');if(!s)return 0;const n=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s;const r=parseFloat(n);return isNaN(r)?0:r};
const waLink=(tel,txt)=>{let d=String(tel||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+(txt?'?text='+encodeURIComponent(txt):'')};

function blank(){return{nome:'',telefone:'',origem:'WhatsApp',tipo:'Evento',categoria:CATEGORIAS[0],interesse:'',etapa:'contato',resultado:'',motivo:'',etapaAnterior:'',conversas:[],
  orcamento:{itens:[],taxaEntrega:0,desconto:0,formaPgto:'PIX',condicoes:'50% de sinal na contratação e 50% até a entrega',dataEvento:'',horario:'',local:'',modo:'Entrega no local',dataEnvio:'',prazoResposta:'',obs:''},
  evento:{contratadoEm:'',pagamentos:[],entregueEm:''},aguardandoDesde:null,followups:{},respondidoEm:'',reuniao:{em:'',tipo:'',obs:''},criadoEm:today(),atualizadoEm:new Date().toISOString()}}
function norm(r){const b=blank();const o=Object.assign(b,r||{});o.orcamento=Object.assign(blank().orcamento,(r||{}).orcamento||{});o.evento=Object.assign(blank().evento,(r||{}).evento||{});o.conversas=Array.isArray(o.conversas)?o.conversas:[];o.orcamento.itens=Array.isArray(o.orcamento.itens)?o.orcamento.itens:[];o.evento.pagamentos=Array.isArray(o.evento.pagamentos)?o.evento.pagamentos:[];o.followups=o.followups&&typeof o.followups==='object'?o.followups:{};o.reuniao=Object.assign({em:'',tipo:'',obs:''},o.reuniao||{});return o}
const subtotal=r=>r.orcamento.itens.reduce((a,i)=>a+num(i.qtd)*num(i.unit),0);
const total=r=>subtotal(r)+num(r.orcamento.taxaEntrega)-num(r.orcamento.desconto);
const pago=r=>r.evento.pagamentos.reduce((a,p)=>a+num(p.valor),0);
const saldo=r=>total(r)-pago(r);
const lastTouch=r=>{const c=r.conversas.filter(x=>!x.sistema).map(x=>x.data).sort().pop();return c||r.criadoEm};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function notice(msg){const n=$('#notice');n.hidden=!msg;n.innerHTML=msg||''}

/* ---------- Follow-up, reunião e prazo ---------- */
const aberto=r=>r.etapa==='contato'||r.etapa==='orcamento';
const pad2=n=>String(n).padStart(2,'0');
const fdt=isoStr=>{if(!isoStr)return '—';const d=new Date(isoStr);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())};
const rel=ms=>{ms=Math.abs(ms);if(ms<36e5)return Math.max(1,Math.round(ms/6e4))+' min';if(ms<DIA)return Math.round(ms/36e5)+'h';const d=Math.round(ms/DIA);return d+(d===1?' dia':' dias')};
function cadence(r,now=Date.now()){
  if(!r.aguardandoDesde||!aberto(r))return null;
  const t0=new Date(r.aguardandoDesde).getTime();
  const steps=FU.map(f=>{const due=t0+f.ms,sent=r.followups[f.k];return {...f,due,sent,state:sent?'sent':now>=due?'due':'wait'}});
  const dues=steps.filter(x=>x.state==='due');dues.slice(0,-1).forEach(x=>x.state='skip');
  const ult=steps[steps.length-1];const endAt=(ult.sent?new Date(ult.sent).getTime():ult.due)+2*DIA;
  const ended=(ult.state==='sent'||ult.state==='due')&&now>=endAt;
  const next=steps.find(x=>x.state==='due')||steps.find(x=>x.state==='wait')||null;
  return {steps,ended,next,t0};
}
const reuniaoEstado=r=>{const em=r.reuniao&&r.reuniao.em;if(!em||r.etapa==='arquivo')return null;const d=em.slice(0,10),h=today();return d===h?'hoje':d>h?'futura':null};
const prazoEstado=r=>{const p=r.orcamento.prazoResposta;if(!p||r.etapa!=='orcamento')return null;const h=today();return p<h?'vencido':p===h?'hoje':'futuro'};
const primeiroContato=r=>r.etapa==='contato'&&!r.aguardandoDesde&&!r.respondidoEm;
function acao(r){
  if(reuniaoEstado(r)==='hoje')return 'meet';
  if(primeiroContato(r))return 'first';
  const pz=prazoEstado(r);if(pz==='vencido'||pz==='hoje')return 'prazo';
  const c=cadence(r);if(c&&c.ended)return 'end';
  if(c&&c.next&&c.next.state==='due')return 'fu';
  return null;
}
function preencher(tpl,r){
  const cat=r.categoria||'';const ev=!cat||cat==='Outro'?'evento':cat==='Presente'?'presente':cat.toLowerCase();
  const data=r.orcamento.dataEvento?'o dia '+fd(r.orcamento.dataEvento):'a data do seu evento';
  return String(tpl||'').split('{nome}').join((r.nome||'').trim().split(/\s+/)[0]||'').split('{evento}').join(ev).split('{data}').join(data);
}
function fuChips(r){
  let h='';
  if(primeiroContato(r))h+='<span class="chip crit">Responder 1º contato</span>';
  else{const c=cadence(r);
    if(c){if(c.ended)h+='<span class="chip crit">Sem resposta: dar desistência?</span>';
      else if(c.next&&c.next.state==='due')h+=`<span class="chip crit">Enviar follow-up ${c.next.label.split(' ·')[0]}</span>`;
      else if(c.next){const falta=c.next.due-Date.now();h+=`<span class="chip ${falta<DIA?'warn':''}">Follow-up ${c.next.label.split(' ·')[0]} em ${rel(falta)}</span>`}
      else h+='<span class="chip warn">Aguardando resposta</span>'}}
  const re=reuniaoEstado(r);if(re){const em=r.reuniao.em;h+=re==='hoje'?`<span class="chip crit">Reunião hoje às ${em.slice(11,16)}</span>`:`<span class="chip">Reunião ${fds(em.slice(0,10))} às ${em.slice(11,16)}</span>`}
  return h?`<div class="chips">${h}</div>`:'';
}
function renderKpis(){
  const ls=all();const now=Date.now();const mes=today().slice(0,7);
  const acoes=ls.filter(x=>acao(x.r)).length;
  const aguard=ls.filter(x=>x.r.aguardandoDesde&&aberto(x.r)).length;
  const abertos=ls.filter(x=>aberto(x.r));const vOrc=abertos.filter(x=>x.r.etapa==='orcamento').reduce((a,x)=>a+total(x.r),0);
  const fech=ls.filter(x=>(x.r.etapa==='evento'||(x.r.etapa==='arquivo'&&x.r.resultado==='entregue'))&&(x.r.evento.contratadoEm||'').startsWith(mes));
  const vF=fech.reduce((a,x)=>a+total(x.r),0);
  $('#kpis').innerHTML=`<div class="kpi hot"><div class="l">Ações para hoje</div><div class="v num">${acoes}</div><div class="s">${acoes?'veja a aba Para hoje':'tudo em dia'}</div></div>
   <div class="kpi"><div class="l">Aguardando resposta</div><div class="v num">${aguard}</div><div class="s">com lembretes ativos</div></div>
   <div class="kpi"><div class="l">Em aberto</div><div class="v num">${abertos.length}</div><div class="s">${brl(vOrc)} em orçamentos</div></div>
   <div class="kpi"><div class="l">Fechado no mês</div><div class="v num">${brl(vF)}</div><div class="s">${fech.length} pedido${fech.length===1?'':'s'}</div></div>`;
}
function renderHoje(){
  const ls=all().filter(matches);const now=Date.now();
  const grupos={meet:[],first:[],prazo:[],fu:[],end:[],prox:[],eventos:[]};
  ls.forEach(x=>{const a=acao(x.r);if(a){grupos[a].push(x);return}
    const c=cadence(x.r);if(c&&c.next&&c.next.due-now<DIA)grupos.prox.push(x);
    if(x.r.etapa==='evento'){const d=diff(x.r.orcamento.dataEvento);if(d!==null&&d>=0&&d<=7)grupos.eventos.push(x)}});
  const by=(f)=>(a,b)=>String(f(a.r)).localeCompare(String(f(b.r)));
  grupos.meet.sort(by(r=>r.reuniao.em));grupos.first.sort(by(r=>r.criadoEm));grupos.prazo.sort(by(r=>r.orcamento.prazoResposta));
  grupos.fu.sort((a,b)=>cadence(a.r).next.due-cadence(b.r).next.due);grupos.prox.sort((a,b)=>cadence(a.r).next.due-cadence(b.r).next.due);
  grupos.eventos.sort(by(r=>r.orcamento.dataEvento));
  const secs=[['meet','Reuniões de hoje'],['first','Responder primeiro contato'],['prazo','Prazo de resposta vencendo'],['fu','Follow-ups para enviar'],['end','Sem resposta após 90 dias'],['prox','Próximas 24 horas'],['eventos','Eventos nos próximos 7 dias']];
  const html=secs.filter(([k])=>grupos[k].length).map(([k,t])=>`<section><h3>${t}<span class="c">${grupos[k].length}</span></h3><div class="list">${grupos[k].map(card).join('')}</div></section>`).join('');
  if(html){$('#board').innerHTML=`<div class="hoje">${html}</div>`;return}
  $('#board').innerHTML=all().length?`<div class="empty"><h3>${q?'Nada encontrado':'Tudo em dia'}</h3><p style="margin:0">${q?'Nenhuma ação de hoje corresponde à busca.':'Nenhum follow-up vence agora. Veja o Quadro para a lista completa.'}</p></div>`
    :'<div class="empty"><h3>Nenhum contato ainda</h3><p style="margin:0">Os pedidos da landing chegam aqui sozinhos. Conversas do WhatsApp você cadastra em “+ Novo contato”: só nome e telefone.</p></div>';
}

/* ---------- Lista ---------- */
function all(){return Object.entries(recs).map(([id,r])=>({id,r:norm(r)}))}
function inStage(k){return all().filter(x=>x.r.etapa===k)}
function matches(x){if(!q)return true;const s=(x.r.nome+' '+x.r.telefone+' '+x.r.categoria+' '+x.r.interesse+' '+(x.r.solicitacao?.protocolo||'')).toLowerCase();return s.includes(q.toLowerCase())}

function colHead(k,list){
  if(k==='contato'){const novos=list.filter(x=>x.r.novo).length;return {lbl:'Contatos',val:list.length,sub:novos?`<b style="color:var(--wine)">${novos} novo${novos===1?'':'s'} pela landing</b>`:list.length?'aguardando orçamento':'nenhum no momento'}}
  if(k==='orcamento'){const v=list.reduce((a,x)=>a+total(x.r),0);const venc=list.filter(x=>{const d=diff(x.r.orcamento.prazoResposta);return d!==null&&d<0}).length;return {lbl:'Orçamentos',val:brl(v),sub:`${list.length} em aberto${venc?` · <span style="color:var(--crit)">${venc} com prazo vencido</span>`:''}`}}
  const rec=list.reduce((a,x)=>a+Math.max(0,saldo(x.r)),0);const prox=list.filter(x=>x.r.orcamento.dataEvento&&diff(x.r.orcamento.dataEvento)>=0).sort((a,b)=>a.r.orcamento.dataEvento.localeCompare(b.r.orcamento.dataEvento))[0];
  return {lbl:'Eventos contratados',val:brl(rec),sub:`a receber${prox?` · próximo ${fds(prox.r.orcamento.dataEvento)} (${esc(prox.r.nome.split(' ')[0])})`:''}`}}
function renderToolbar(){
  const had=document.activeElement&&document.activeElement.id==='search';
  const nArq=inStage('arquivo').length;
  const nHoje=all().filter(x=>acao(x.r)).length;
  const nPromo=Object.values(promoLeads).flat().filter(l=>!l.contatado_em).length;
  $('#toolbar').innerHTML=`<div class="views" role="group" aria-label="Visualização"><button data-view="hoje" aria-pressed="${tab==='hoje'}">Para hoje${nHoje?` <span class="n num">${nHoje}</span>`:''}</button><button data-view="board" aria-pressed="${tab==='board'}">Quadro</button><button data-view="promo" aria-pressed="${tab==='promo'}">Promoções${nPromo?` <span class="n num">${nPromo}</span>`:''}</button></div>`
   +`<input class="search" id="search" type="search" placeholder="${tab==='promo'?'Buscar inscrito: nome, telefone, e-mail':'Buscar nome, telefone, protocolo'}" value="${esc(q)}" aria-label="Buscar">`
   +(tab==='arquivo'?'<button class="btn" data-view="board">← Voltar ao quadro</button>':`<button class="btn" data-view="arquivo">Arquivo <span class="chip num" style="padding:0 7px">${nArq}</span></button>`);
  if(had){const e=$('#search');e.focus();e.setSelectionRange(e.value.length,e.value.length)}
}
function dueChip(r){const d=diff(r.orcamento.prazoResposta);if(d===null)return '<span class="chip">sem prazo de resposta</span>';if(d<0)return `<span class="chip crit">prazo vencido há ${-d} dia${d===-1?'':'s'}</span>`;if(d===0)return '<span class="chip warn">responder hoje</span>';if(d<=2)return `<span class="chip warn">prazo em ${d} dia${d===1?'':'s'}</span>`;return `<span class="chip">prazo ${fds(r.orcamento.prazoResposta)}</span>`}
function eventChip(r){const d=diff(r.orcamento.dataEvento);if(d===null)return '<span class="chip warn">sem data</span>';if(d<0)return `<span class="chip crit">data passou (${fds(r.orcamento.dataEvento)})</span>`;if(d===0)return '<span class="chip accent">é hoje</span>';if(d<=7)return `<span class="chip accent">em ${d} dia${d===1?'':'s'} · ${fds(r.orcamento.dataEvento)}</span>`;return `<span class="chip">${fd(r.orcamento.dataEvento)}</span>`}
function card(x){const r=x.r;let body='';
  const site=r.solicitacao?`<span class="chip gold">${esc(r.solicitacao.protocolo||'Landing')}</span>`:'';
  if(r.etapa==='contato'){const d=-diff(lastTouch(r));body=`<div class="snip">${esc(r.interesse)||'<span class="meta">Sem interesse registrado</span>'}</div><div class="chips">${r.novo?'<span class="chip wine">novo</span>':''}<span class="chip accent">${esc(r.categoria)}</span><span class="chip">${esc(r.origem)}</span>${site}${r.orcamento.dataEvento?`<span class="chip">evento ${fds(r.orcamento.dataEvento)}</span>`:''}<span class="chip ${d>=3?'warn':''}">último contato ${d===0?'hoje':d===1?'ontem':'há '+d+' dias'}</span></div>`}
  else if(r.etapa==='orcamento'){body=`<div class="row"><span class="meta">${r.orcamento.dataEvento?'Evento '+fd(r.orcamento.dataEvento):'Data a definir'}</span><span class="money num">${brl(total(r))}</span></div><div class="chips"><span class="chip accent">${esc(r.categoria)}</span>${dueChip(r)}</div>`}

function sorted(list,k){

function renderDrawer(){

  if(open.pending)body=confirmBox(open.pending,r)+body;
  root.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer${canWrite?'':' readonly'}" role="dialog" aria-modal="true" aria-label="${esc(st)}">
   <div class="dhead"><div><div class="stage">${esc(st)}</div><h2>${esc(r.nome)||'Sem nome'}</h2>${R?`<div class="chips" style="margin-top:6px"><span class="chip ${R.c}">${R.t}</span>${r.motivo?`<span class="chip">${esc(r.motivo)}</span>`:''}</div>`:''}</div><div class="dh-acts">${!open.isNew&&r.etapa!=='arquivo'&&canWrite?`<label class="mover"><span>Mover para</span><select id="moverPara" aria-label="Mover para outra etapa"><option value="">Escolher…</option>${Object.entries(ETAPA_NOME).filter(([k])=>k!==r.etapa).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`:''}<button class="close" data-act="close" aria-label="Fechar">×</button></div></div>
   <div class="dbody">${body}</div><div class="dfoot">${footer(r)}</div></aside>`;
  root.querySelector('.dbody').scrollTop=open.pending?0:keepScroll;
}
function openRec(id){
  open={id,isNew:false,draft:norm(clone(recs[id])),dirty:false,pending:null};renderDrawer();
  // Marca como visto o pedido novo da landing
  if(recs[id].novo&&canWrite&&sb){const d=clone(recs[id]);d.novo=false;recs[id]=d;sb.from('pedidos').update({dados:d,atualizado_em:new Date().toISOString()}).eq('id',id).then(()=>{});open.draft.novo=false;renderAll()}
}
function openNew(){open={id:null,isNew:true,draft:blank(),dirty:true,pending:null};renderDrawer();setTimeout(()=>$('#f_nome')?.focus(),30)}
function closeDrawer(){open=null;renderDrawer()}
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
function refreshTotals(){if(!open)return;const r=open.draft;document.querySelectorAll('[data-linetotal]').forEach(el=>{const it=r.orcamento.itens[+el.dataset.linetotal];if(it)el.textContent=brl(num(it.qtd)*num(it.unit))});const a=document.querySelector('[data-tot="sub"]');if(a)a.textContent=brl(subtotal(r));const b=document.querySelector('[data-tot="total"]');if(b)b.textContent=brl(total(r))}
function markDirty(){if(!open.dirty){open.dirty=true;const b=document.querySelector('[data-act="save"]');if(b)b.disabled=false}}

async function persist(r,msg){
  if(!sb){toast('Sem conexão com o banco. Verifique a configuração.');return false}
  const data=clone(r);data.atualizadoEm=new Date().toISOString();
  data.orcamento.taxaEntrega=num(data.orcamento.taxaEntrega);data.orcamento.desconto=num(data.orcamento.desconto);
  data.orcamento.itens=data.orcamento.itens.map(i=>({desc:i.desc||'',qtd:num(i.qtd),unit:num(i.unit)}));
  try{
    let id=open.id;
    if(open.isNew){id=crypto.randomUUID();const {error}=await sb.from('pedidos').insert({id,dados:data});if(error)throw error;open.id=id;open.isNew=false}
    else{const {error}=await sb.from('pedidos').update({dados:data,atualizado_em:data.atualizadoEm}).eq('id',id);if(error)throw error}
    recs[id]=data;open.draft=norm(clone(data));open.dirty=false;if(msg)toast(msg);renderAll();renderDrawer();return true
  }catch(e){
    console.error(e);
    if(e&&(e.code==='42501'||/row-level security/i.test(e.message||''))){canWrite=false;toast('Seu e-mail não tem permissão para editar.')}
    else toast('Não foi possível salvar. Verifique a conexão e tente de novo.');
    return false}
}
function sysNote(r,texto){r.conversas.push({data:today(),texto,sistema:true})}

function waText(r){const o=r.orcamento;const L=[];
  L.push(`Olá, ${r.nome.split(' ')[0]||''}! Segue o orçamento da Chowder Macarons:`);L.push('');
  o.itens.forEach(i=>L.push(`• ${i.desc||'Item'}: ${num(i.qtd)} × ${brl(num(i.unit))} = ${brl(num(i.qtd)*num(i.unit))}`));
  if(num(o.taxaEntrega))L.push(`• Taxa de entrega: ${brl(num(o.taxaEntrega))}`);
  if(num(o.desconto))L.push(`• Desconto: -${brl(num(o.desconto))}`);
  L.push('');L.push(`*Total: ${brl(total(r))}*`);L.push('');
  if(o.dataEvento)L.push(`${r.tipo==='Pronta entrega'?'Entrega/retirada':'Data do evento'}: ${fd(o.dataEvento)}${o.horario?' às '+o.horario:''}`);
  L.push(`${o.modo}${o.local&&!/^Retirada/.test(o.modo)?': '+o.local:''}`);
  L.push(`Pagamento: ${o.formaPgto}${o.condicoes?' — '+o.condicoes:''}`);
  if(o.obs)L.push(`Obs.: ${o.obs}`);
  if(r.etapa==='orcamento'&&o.prazoResposta){L.push('');L.push(`Este orçamento vale até ${fd(o.prazoResposta)}.`)}
  if(r.etapa==='evento'){L.push('');L.push(`Pago até agora: ${brl(pago(r))} · Saldo: ${brl(saldo(r))}`)}
  return L.join('\n')}

document.addEventListener('click',async ev=>{
  const fu=ev.target.closest('[data-fu]');
  if(fu&&open&&!open.isNew){const r=open.draft,a=fu.dataset.fu,k=fu.dataset.k;const agora=new Date().toISOString();
    if(!canWrite){toast('Você não tem permissão para editar.');return}
    if(a==='copiar'){const txt=preencher(mensagens[k],r);try{await navigator.clipboard.writeText(txt);toast('Texto copiado')}catch(e){const el=$('#fumsg_'+k);if(el){const rg=document.createRange();rg.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg)}toast('Texto selecionado. Copie com o menu do aparelho.')}return}
    if(a==='iniciar'){const era=primeiroContato(r);r.aguardandoDesde=agora;r.followups={};r.respondidoEm=r.respondidoEm||agora;r.novo=false;sysNote(r,era?'Resposta inicial enviada. Lembretes iniciados.':'Mensagem enviada. Aguardando retorno.');await persist(r,'Lembretes de 24h a 90 dias iniciados');return}
    if(a==='respondeu'){r.aguardandoDesde=null;r.followups={};r.respondidoEm=r.respondidoEm||agora;sysNote(r,'Cliente respondeu.');await persist(r,'Lembretes pausados');return}
    if(a==='enviado'){r.followups={...r.followups,[k]:agora};const f=FU.find(x=>x.k===k);sysNote(r,'Follow-up '+f.label+' enviado.');await persist(r,'Follow-up registrado');return}
    if(a==='desistir'){const ult=[...FU].reverse().find(f=>r.followups[f.k])||ULTIMO;const mot='Sem resposta após '+ult.label.split(' ·')[0];r.etapaAnterior=r.etapa;r.etapa='arquivo';r.resultado='sem_resposta';r.motivo=mot;r.aguardandoDesde=null;r.novo=false;sysNote(r,mot+'. Marcado como desistência.');await persist(r,'Marcado como desistência');return}
  }
  const t=ev.target.closest('[data-view],[data-open],[data-act],[data-delit],[data-delpay],[data-delconv],[data-addpac]');if(!t)return;
  if(t.dataset.view){tab=t.dataset.view;renderAll();return}
  if(t.dataset.open){openRec(t.dataset.open);return}
  if(!open&&t.dataset.act!=='novo')return;
  const r=open?open.draft:null;
  if(t.dataset.addpac){const p=C.pacotes.find(x=>x.id===t.dataset.addpac);if(p){r.orcamento.itens.push({desc:p.nome+' ('+p.detalhe+')',qtd:1,unit:p.valor});markDirty();renderDrawer()}return}
  if(t.dataset.delit!==undefined){r.orcamento.itens.splice(+t.dataset.delit,1);markDirty();renderDrawer();return}
  if(t.dataset.delpay!==undefined){r.evento.pagamentos.splice(+t.dataset.delpay,1);await persist(r,'Pagamento removido');return}
  if(t.dataset.delconv!==undefined){r.conversas.splice(+t.dataset.delconv,1);await persist(r,'Anotação removida');return}
  switch(t.dataset.act){
    case 'novo':openNew();break;
    case 'close':if(open&&open.dirty&&!open.isNew){open.pending=null;if(await persist(r))closeDrawer();}else closeDrawer();break;
    case 'save':if(!r.nome.trim()){toast('Informe o nome do contato.');$('#f_nome')?.focus();return}await persist(r,open.isNew?'Contato registrado':'Alterações salvas');break;
    case 'additem':r.orcamento.itens.push({desc:'',qtd:'',unit:''});markDirty();renderDrawer();setTimeout(()=>document.getElementById('it_d_'+(r.orcamento.itens.length-1))?.focus(),20);break;
    case 'addconv':{const tx=$('#nc_txt').value.trim();if(!tx){$('#nc_txt').focus();return}r.conversas.push({data:$('#nc_data').value||today(),texto:tx});await persist(r,'Conversa registrada');break}
    case 'addpay':{const v=num($('#np_valor').value);if(!v){$('#np_valor').focus();toast('Informe o valor do pagamento.');return}r.evento.pagamentos.push({data:$('#np_data').value||today(),valor:v,forma:$('#np_forma').value,obs:$('#np_obs').value.trim()});r.evento.pagamentos.sort((a,b)=>(a.data||'').localeCompare(b.data||''));await persist(r,'Pagamento registrado');break}
    case 'toorc':{r.etapa='orcamento';r.novo=false;
      if(!r.orcamento.itens.length){const pac=r.solicitacao&&r.solicitacao.pacote;
        if(pac&&pac.valor)r.orcamento.itens.push({desc:pac.nome+' ('+pac.detalhe+')',qtd:1,unit:pac.valor});
        else r.orcamento.itens.push({desc:r.tipo==='Pronta entrega'?'Macarons sortidos':'Macarons para '+r.categoria.toLowerCase(),qtd:'',unit:''})}
      if(!r.orcamento.dataEnvio)r.orcamento.dataEnvio=today();if(!r.orcamento.prazoResposta)r.orcamento.prazoResposta=addDays(r.orcamento.dataEnvio,3);sysNote(r,'Orçamento criado');await persist(r,'Orçamento criado');break}
    case 'encerrar':case 'naoaceito':case 'entregue':case 'contratar':case 'excluir':open.pending={kind:t.dataset.act};renderDrawer();break;
    case 'cf_no':open.pending=null;renderDrawer();break;
    case 'cf_ok':{const k=open.pending.kind;open.pending=null;
      if(k==='encerrar'||k==='naoaceito'){const m=$('#cf_motivo').value,d=$('#cf_det').value.trim();r.motivo=m+(d?' — '+d:'');r.etapaAnterior=r.etapa;r.etapa='arquivo';r.novo=false;r.aguardandoDesde=null;r.resultado=k==='encerrar'?'contato_encerrado':'orcamento_recusado';sysNote(r,(k==='encerrar'?'Contato encerrado: ':'Orçamento não aceito: ')+r.motivo);await persist(r,k==='encerrar'?'Contato encerrado':'Orçamento marcado como não aceito')}
      else if(k==='contratar'){r.etapa='evento';r.aguardandoDesde=null;r.evento.contratadoEm=today();sysNote(r,'Orçamento contratado — '+brl(total(r)));await persist(r,'Orçamento contratado. Agora em Eventos contratados.')}
      else if(k==='entregue'){r.etapaAnterior='evento';r.etapa='arquivo';r.resultado='entregue';r.motivo='';r.evento.entregueEm=today();sysNote(r,'Evento entregue com sucesso');await persist(r,'Evento entregue com sucesso')}
      else if(k==='excluir'){const id=open.id;const {error}=await sb.from('pedidos').delete().eq('id',id);if(error){toast('Não foi possível excluir.');break}
        const sol=recs[id]?.solicitacao;if(sol&&sol.pdfUrl)sb.storage.from(C.bucketPdf).remove([sol.pdfPath||id+'.pdf']).then(()=>{});
        delete recs[id];closeDrawer();renderAll();toast('Registro excluído')}
      break}
    case 'reabrir':{const back=r.etapaAnterior||'contato';r.etapa=back;r.aguardandoDesde=null;r.followups={};r.resultado='';r.motivo='';if(back==='evento')r.evento.entregueEm='';sysNote(r,'Reaberto em '+STAGE_TITLE[back]);await persist(r,'Registro reaberto');break}
    case 'copy':{const txt=waText(r);try{await navigator.clipboard.writeText(txt);toast('Texto copiado. Cole no WhatsApp.')}catch(e){const root=$('.dbody');root.insertAdjacentHTML('afterbegin',`<section class="box"><h3>Copie o texto abaixo</h3><textarea class="cell" id="copyArea" rows="10" readonly>${esc(txt)}</textarea></section>`);const a=$('#copyArea');a.focus();a.select();root.scrollTop=0}break}
  }
});

const ETAPA_NOME={contato:'Contatos',orcamento:'Orçamentos',evento:'Eventos contratados'};
async function moverPara(id,to){
  if(!canWrite){toast('Você não tem permissão para editar.');return}
  if(!open||open.id!==id)openRec(id);
  const r=open.draft,from=r.etapa;if(from===to)return;
  if(to==='evento'){open.pending={kind:'contratar'};renderDrawer();return}   // pede confirmação
  if(to==='orcamento'&&from==='contato'){document.querySelector('.dfoot [data-act="toorc"]')?.click();return}
  r.etapa=to;r.novo=false;
  sysNote(r,`Movido de ${ETAPA_NOME[from]} para ${ETAPA_NOME[to]}.`);
  await persist(r,'Movido para '+ETAPA_NOME[to]);
}

let soc=null; // {lista,voce,carregando,erro,edit:{email,tipo},ocupado}
async function chamarSocios(body){
  const {data,error}=await sb.functions.invoke('pedidos-socios',{body});
  if(error){let msg='Não foi possível falar com o servidor. Tente de novo.';try{const j=await error.context.json();if(j&&j.erro)msg=j.erro}catch(e){}throw new Error(msg)}
  if(data&&data.erro)throw new Error(data.erro);
  return data;
}

async function comprimir(file){
  const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  let blob=await new Promise(r=>c.toBlob(r,'image/webp',0.86));if(!blob||blob.type!=='image/webp')blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
  return {blob,w:c.width,h:c.height};
}

  const {data,error}=await sb.from('pedidos').select('id,dados').order('criado_em',{ascending:false});
  if(error){loaded=true;notice('Não foi possível carregar os registros. '+esc(error.message));renderAll();return}
  const n={};data.forEach(x=>{n[x.id]=x.dados});recs=n;loaded=true;
  sb.from('pedidos_config').select('valor').eq('chave','mensagens').maybeSingle().then(({data:cfg})=>{if(cfg&&cfg.valor)mensagens={...MSG_PADRAO,...cfg.valor}});
  if(!data.length){const {data:adm}=await sb.from('pedidos_admins').select('email').limit(1);if(!adm||!adm.length){canWrite=false;notice('Seu e-mail (<b>'+esc(userEmail)+'</b>) ainda não está na lista de sócios autorizados. Peça para incluir na tabela <b>pedidos_admins</b> do Supabase.')}}
  renderAll();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('pedidos-live').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},payload=>{
    if(payload.eventType==='DELETE'){delete recs[payload.old.id]}
    else{const chegou=payload.eventType==='INSERT'&&!recs[payload.new.id];recs[payload.new.id]=payload.new.dados;if(chegou&&payload.new.dados&&payload.new.dados.novo)toast('Novo pedido da landing: '+(payload.new.dados.nome||''))}
    renderAll();
  }).on('postgres_changes',{event:'INSERT',schema:'public',table:'promocoes_leads'},payload=>{
    const l=payload.new;if(!l||!promoCarregado)return;const lst=promoLeads[l.promocao_id]=promoLeads[l.promocao_id]||[];
    if(!lst.find(x=>x.id===l.id)){lst.unshift(l);const p=promos.find(x=>x.id===l.promocao_id);toast('Novo cadastro'+(p?' na '+p.titulo:'')+': '+(l.nome||''))}
    renderToolbar();if(tab==='promo')renderBoard();
  }).subscribe();
  carregarPromos();
}
function showApp(user){
  userEmail=user.email||'';$('#who').textContent=userEmail;
  $('#login').hidden=true;$('#topActions').hidden=false;$('#main').hidden=false;canWrite=true;notice('');carregar();
}
function showLogin(){
  $('#login').hidden=false;$('#topActions').hidden=true;$('#main').hidden=true;closeDrawer();recs={};promos=[];promoLeads={};promoCarregado=false;promoEd=null;renderPromoEd();if(tab==='promo')tab='hoje';
  if(channel){sb.removeChannel(channel);channel=null}
}
$('#login').addEventListener('submit',async ev=>{
  ev.preventDefault();const m=$('#lg_msg');m.hidden=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('#lg_email').value.trim(),password:$('#lg_senha').value});
  if(error){m.hidden=false;m.textContent='E-mail ou senha incorretos.';return}
  showApp(data.user);
});
$('#btnSair').addEventListener('click',async()=>{await sb.auth.signOut();showLogin()});

(async()=>{
  if(!C.supabaseUrl||!C.supabaseAnonKey||!window.supabase){
    notice('<b>Banco ainda não configurado.</b> Preencha <code>supabaseUrl</code> e <code>supabaseAnonKey</code> em <code>js/config.js</code> seguindo o passo a passo do README. Até lá, a landing funciona só com PDF + WhatsApp.');
    return}
  sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
  const {data}=await sb.auth.getSession();
  if(data.session)showApp(data.session.user);else showLogin();
  sb.auth.onAuthStateChange((evt,session)=>{if(evt==='SIGNED_OUT')showLogin()});
})();
})();
</script>
</body>
