<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131F37">
<title>Pedido de orçamento · Chowder Macarons</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chowder Macarons">
<meta property="og:title" content="Pedido de orçamento · Chowder Macarons">
<meta property="og:description" content="Pedido feito pela página de encomendas. Toque para ver o PDF completo.">
<meta property="og:image" content="https://chef-chowder-bakeshop.vercel.app/assets/img/og-pedido.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--navy:#131F37;--bord:#591524;--gold:#C4A265;--cream:#F5EFE6;--mute:#CDD0DC;
  --f-display:"Cormorant Garamond",Georgia,serif;--f-body:"Source Sans 3",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--cream);font:17px/1.5 var(--f-body);
  background:radial-gradient(120% 70% at 85% 100%,var(--bord) 0,rgba(89,21,36,.55) 38%,transparent 70%),var(--navy)}
.card{width:100%;max-width:440px;text-align:center;border:1px solid rgba(196,162,101,.6);border-radius:16px;padding:32px 22px;background:rgba(19,31,55,.55)}
.card img{width:180px;height:auto;margin:0 auto}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold);margin:18px auto;max-width:240px}
.rule::before,.rule::after{content:"";height:1px;background:currentColor;flex:1}
.rule i{width:5px;height:5px;border-radius:50%;background:currentColor}
h1{font-family:var(--f-display);font-weight:500;font-size:2.2rem;line-height:1.1;margin:0}
p{color:var(--mute);margin:10px 0 0}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:1.05rem}
.btn.pri{background:var(--gold);color:var(--navy);margin-top:24px}
.btn.sec{color:var(--cream);box-shadow:inset 0 0 0 1px rgba(245,239,230,.4)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
small{display:block;margin-top:22px;color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<main class="card">
  <img src="/assets/img/logo-branca.webp" alt="Chowder Macarons" width="180" height="103">
  <div class="rule" aria-hidden="true"><i></i></div>
  <h1>Pedido de orçamento</h1>
  <p id="txt">Pedido feito pela página de encomendas da Chowder Macarons.</p>
  <a class="btn pri" id="ver" href="/">Ver o pedido completo (PDF)</a>
  <a class="btn sec" href="/">Conhecer a Chowder Macarons</a>
  <small>Av. Cézar Hilal, 570, loja 4 · Bento Ferreira, Vitória-ES · @chowdermacarons</small>
</main>
<script>
var t = (location.pathname.split("/")[2] || "").trim();
if (/^[A-Za-z0-9]{10,32}$/.test(t)) document.getElementById("ver").href = "/pdf/" + t;
else { document.getElementById("ver").hidden = true; document.getElementById("txt").textContent = "Não encontramos este pedido. Confira o link recebido."; }
</script>
</body>
</html>
